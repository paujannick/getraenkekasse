<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login · Getränkekasse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body style="display:grid;place-items:center;min-height:100vh;background:linear-gradient(160deg,var(--bg) 0%,var(--bg-sunken) 100%);">
<div class="card" style="width:min(420px,95vw);">
    <div style="text-align:center;margin-bottom:1.25rem;">
        <div style="font-size:2rem;">🥤</div>
        <h1 style="margin:0.5rem 0 0.25rem;">Getränkekasse</h1>
        <p class="text-muted" style="margin:0;">Admin-Zugang</p>
    </div>
    {% if error %}<div class="sec-banner">{{ error }}</div>{% endif %}
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Benutzername</label>
        <input type="text" name="username" autofocus autocomplete="username" required>
        <label class="mt-4">Passwort</label>
        <input type="password" name="password" autocomplete="current-password" required>
        {% if needs_totp %}
        <label class="mt-4">2FA-Code</label>
        <input type="text" name="totp" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required>
        {% endif %}
        <button type="submit" class="primary block mt-4">Anmelden</button>
    </form>
    <p class="text-muted mt-4" style="font-size:0.8rem;text-align:center;">
        Standard: <code>admin</code> / <code>admin</code> – bitte sofort ändern.
    </p>
</div>
</body>
</html>

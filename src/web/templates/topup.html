{% extends '_layout.html' %}
{% block title %}Guthaben aufladen{% endblock %}
{% block content %}
<h1>Guthaben aufladen</h1>
<p class="subheader">Bargeld landet automatisch in der Terminal-Kasse, Überweisungen auf dem Bankkonto.</p>

<div class="card">
<form method="post" action="{{ url_for('topup_submit') }}" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
        <label>Karte lesen</label>
        <div class="form-row">
            <input type="text" name="uid" id="uid_topup">
            <button class="btn small" type="button" onclick="readUid('uid_topup')">Lesen</button>
        </div>
        <span class="text-muted" id="name_topup"></span>
    </div>
    <div>
        <label>oder Nutzer wählen</label>
        <select name="user_name">
            <option value="">– wählen –</option>
            {% for u in users %}<option value="{{ u['name'] }}">{{ u['name'] }}</option>{% endfor %}
        </select>
    </div>
    <div><label>Betrag (€)</label><input type="number" step="0.01" name="amount" required></div>
    <div style="grid-column:1 / -1;display:flex;gap:.5rem;">
        <button class="primary" type="submit">Aufladen (bar in Kühlschrank-Kasse)</button>
        <a class="btn ghost" href="{{ url_for('users') }}">Zurück</a>
    </div>
</form>
</div>

<script>
function readUid(id) {
    fetch('{{ url_for("read_uid") }}').then(r=>r.json()).then(d => {
        if (d.error) { gkToast(d.error, {level:'error'}); return; }
        document.getElementById(id).value = d.uid;
        fetch('{{ url_for("user_name") }}?uid=' + encodeURIComponent(d.uid))
            .then(r=>r.json()).then(x => document.getElementById('name_topup').textContent = x.name || 'Unbekannt');
    });
}
</script>
{% endblock %}

{% extends '_layout.html' %}
{% block title %}Getränk bearbeiten{% endblock %}
{% block content %}
<h1>{{ drink['name'] }} bearbeiten</h1>
{% if error %}<div class="sec-banner">{{ error }}</div>{% endif %}

<div class="card">
<form method="post" enctype="multipart/form-data" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div><label>Name</label><input name="name" value="{{ drink['name'] }}" required></div>
    <div><label>Preis (€)</label><input type="number" step="0.01" name="price" value="{{ '%.2f'|format(drink['price']/100) }}" required></div>
    <div><label>Bestand</label><input type="number" name="stock" value="{{ drink['stock'] }}"></div>
    <div><label>Mindestbestand</label><input type="number" name="min_stock" value="{{ drink['min_stock'] }}"></div>
    <div><label>Seite</label><input type="number" name="page" min="1" max="9" value="{{ drink['page'] }}"></div>
    <div>
        <label>Kategorie</label>
        <select name="category_id">
            <option value="">– keine –</option>
            {% for c in categories %}
            <option value="{{ c['id'] }}" {% if drink['category_id']==c['id'] %}selected{% endif %}>{{ c['name'] }}</option>
            {% endfor %}
        </select>
    </div>
    <div><label>Barcode / EAN</label><input name="barcode" value="{{ drink['barcode'] or '' }}" placeholder="optional, für Scanner"></div>
    <input type="hidden" name="current_image" value="{{ drink['image'] or '' }}">
    <div><label>Logo</label><input type="file" name="image" accept="image/*"></div>
    <div style="align-self:end;display:flex;gap:.5rem;">
        <button class="primary" type="submit">Speichern</button>
        {% if 'drink_history' in url_map_endpoints %}
        <a class="btn" href="{{ url_for('drink_history', drink_id=drink['id']) }}">Preishistorie</a>
        {% endif %}
        <a class="btn ghost" href="{{ url_for('drinks') }}">Zurück</a>
    </div>
</form>
</div>
{% endblock %}
